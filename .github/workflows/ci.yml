name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.3.1"
          elixir-version: "1.20.4-otp-28"
      - uses: actions/setup-node@v4
        with:
          node-version: "26.10.0"
      - name: Install pinned shared parser
        run: |
          git clone https://github.com/theKINelectric/js_ts_parser.git ../js_ts_parser
          git -C ../js_ts_parser checkout 39c14b5
          npm ci --ignore-scripts --prefix ../js_ts_parser
          npm test --prefix ../js_ts_parser
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
